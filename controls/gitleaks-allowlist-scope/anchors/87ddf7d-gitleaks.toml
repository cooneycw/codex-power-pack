title = "codex-power-pack gitleaks config"

# WITHOUT THIS BLOCK THE SCANNER HAS NO RULES AT ALL (issue #263).
#
# Passing --config REPLACES gitleaks' built-in ruleset; it does not merge with
# it. This file declared a title and an [allowlist] and nothing else, so every
# `gitleaks detect --config .gitleaks.toml` run - CI step 1 and `make
# secret-scan` alike - scanned with zero rules and reported "no leaks found" on
# anything, including a real AWS access token. Measured against the pinned image
# zricethezav/gitleaks:v8.18.4: an identical fixture detects as `aws-access-token`
# under the default ruleset and is silent under this config.
#
# The `secret-scan` CI step now runs a positive-control probe before the repo
# scan for exactly this reason: a green scan is what the broken state produced,
# so a green scan alone is not evidence the scanner works.
[extend]
useDefault = true

#: NEGATIVE-CONTROL: secret-scan-rules
#:
#: This file is HALF A GATE. gitleaks is the other half, and it was working
#: correctly all the way through #263 - the blindness was here, in the config,
#: which is why the control's anchor is a config rather than a script. The
#: directive above registers it with scripts/check-negative-controls.py; run
#: `make negative-controls` on a host with gitleaks to exercise it.

[allowlist]
description = "False positives from test fixtures and masking regex patterns"
paths = [
    # The negative-control fixtures for this very file. They contain a
    # fabricated AWS key on purpose: the control needs an input the ruleset
    # REPORTS, and anything the ruleset reports is also reported when it is
    # sitting in the repository.
    #
    # This is not the circular exclusion that issue #246 refuses. A path entry
    # is matched RELATIVE TO THE SCAN ROOT, and the control scans each case AS
    # the root - so the fixture is hidden from the repository scan and fully
    # exposed to the control that needs to see it. It hides bytes this file's
    # own control authored, never a live path, and the coverage probe in
    # .woodpecker.yml separately proves the live paths are still scanned.
    '''^controls/secret-scan-rules/cases/''',
    '''tests/test_creds_masking\.py''',
    '''scripts/secrets-mask\.sh''',
    '''lib/creds/masking\.py''',
]
regexTarget = "match"
regexes = [
    '''AKIAIOSFODNN7EXAMPLE''',
    '''sk-abc123xyz456def789''',
    '''ghp_abc123def456ghi789jkl012mno345pqr678''',
    '''BEGIN OPENSSH PRIVATE KEY.*REDACTED''',
    '''BEGIN RSA PRIVATE KEY.*MIIEpAIBAAKCAQEA''',
    # Synthetic token in tests/test_plugin_hooks.py, asserting the friction
    # hook MASKS a secret it is handed. Allowlisted by value rather than by
    # path deliberately: a path entry would also suppress a real secret later
    # added to that file, which is the over-broad suppression #263 is about.
    '''"ghp_abcdefghijklmnopqrstuvwxyz123456"''',
]
