name: Feature Request
description: Request a new command, skill, or capability
labels: ["enhancement", "feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome you want and why it matters. A short issue is enough
        for small work; for larger work, link the governing spec sections.
        [Issue contract](https://github.com/cooneycw/codex-power-pack/blob/main/docs/agents/issue-contract.md)

  - type: dropdown
    id: type
    attributes:
      label: Feature type
      options:
        - New Codex skill or command
        - New skill
        - MCP server enhancement
        - Hook/automation
        - Documentation addition
        - Integration
        - Other
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Feature name
      description: A short name for this feature
      placeholder: "e.g., $spec-sync preview"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Intended outcome and motivation
      description: What should become possible, why does it matter, and what would show it works?
      placeholder: |
        As a [type of user], I want to [do something]
        so that [benefit/outcome].
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed approach (optional, revisable)
      description: If you have an approach in mind, describe it as a suggestion that can change within the outcome and constraints.
    validations:
      required: false

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and rationale (optional)
      description: Record any binding boundaries and why they exist. Missing rationale does not make an existing constraint optional.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other solutions have you tried or considered?
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this feature
          required: false
